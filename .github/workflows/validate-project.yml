name: Validate O3DE Project

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pilot and kart blockout models
        run: python scripts/generate_blockout_assets.py

      - name: Validate manifests, generated assets and gameplay source
        run: python scripts/validate_project.py

      - name: Check JSON formatting
        run: |
          python -m json.tool project.json >/dev/null
          python -m json.tool Gem/gem.json >/dev/null
          python -m json.tool Assets/Config/game_content.json >/dev/null

      - name: Publish generated 3D blockouts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: SpaceKartLegends-3D-blockouts
          path: Assets/Blockout/**/*.gltf
          if-no-files-found: error
          retention-days: 14
