name: Build Turnkey Android Game

on:
  push:
    branches:
      - agent/o3de-space-kart-3d-v1
    paths:
      - "android-standalone/**"
      - "scripts/generate_standalone_android_project.py"
      - "scripts/android_project_payload/**"
      - ".github/workflows/build-turnkey-android.yml"
  pull_request:
    paths:
      - "android-standalone/**"
      - "scripts/generate_standalone_android_project.py"
      - "scripts/android_project_payload/**"
      - ".github/workflows/build-turnkey-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate standalone Android project
        run: python3 scripts/generate_standalone_android_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android API 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate public placeholder pilots
        run: python3 android-standalone/tools/generate_placeholder_glb.py

      - name: Build real debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-standalone :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and package base APK plus signing tools
        shell: bash
        run: |
          set -euo pipefail
          APK="android-standalone/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p dist
          cp "$APK" dist/SpaceKartLegends-base-debug.apk
          sha256sum dist/SpaceKartLegends-base-debug.apk > dist/BASE_SHA256SUMS.txt

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -f "$BUILD_TOOLS_DIR/lib/apksigner.jar"
          cp -a "$BUILD_TOOLS_DIR" dist/android-build-tools

      - name: Upload base APK and Android tools
        uses: actions/upload-artifact@v4
        with:
          name: SpaceKartLegends-turnkey-base
          path: dist/
          if-no-files-found: error
          retention-days: 14
