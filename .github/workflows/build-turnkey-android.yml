name: Build Turnkey Android Game

on:
  push:
    branches:
      - agent/o3de-space-kart-3d-v1
    paths:
      - "android-standalone/**"
      - "scripts/generate_standalone_android_project.py"
      - "scripts/android_project_payload/**"
      - ".github/workflows/build-turnkey-android.yml"
  pull_request:
    paths:
      - "android-standalone/**"
      - "scripts/generate_standalone_android_project.py"
      - "scripts/android_project_payload/**"
      - ".github/workflows/build-turnkey-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate standalone Android project
        run: python3 scripts/generate_standalone_android_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android API 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Generate public placeholder pilots
        run: python3 android-standalone/tools/generate_placeholder_glb.py

      - name: Build real debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-standalone :app:assembleDebug --no-daemon --stacktrace

      - name: Launch and smoke test on Android 14 emulator
        shell: bash
        run: |
          set -euo pipefail
          APK="android-standalone/app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE="com.chasmet.spacekartlegends"
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name spacekart-ci --package "system-images;android-34;google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd spacekart-ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -no-snapshot-save -wipe-data -accel on -gpu swiftshader_indirect \
            -camera-back none -camera-front none \
            > emulator.log 2>&1 &
          if ! timeout 300 "$ADB" wait-for-device; then
            cat emulator.log
            exit 1
          fi
          BOOTED=0
          for attempt in $(seq 1 120); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then
            "$ADB" devices -l || true
            cat emulator.log
            exit 1
          fi
          "$ADB" logcat -c
          "$ADB" install -r "$APK"
          "$ADB" shell am start -W -n "$PACKAGE/.MainActivity" | tee activity-start.txt
          sleep 12
          "$ADB" shell pidof "$PACKAGE" | grep -E '[0-9]+'
          "$ADB" shell dumpsys activity activities | grep -F "$PACKAGE/.MainActivity"
          "$ADB" logcat -d > logcat.txt
          if grep -A 20 -B 5 -E "FATAL EXCEPTION|AndroidRuntime.*$PACKAGE|Process: $PACKAGE" logcat.txt; then
            echo "The game crashed during emulator smoke test." >&2
            exit 1
          fi

      - name: Verify and package base APK plus signing tools
        shell: bash
        run: |
          set -euo pipefail
          APK="android-standalone/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p dist
          cp "$APK" dist/SpaceKartLegends-base-debug.apk
          cp activity-start.txt dist/
          cp logcat.txt dist/
          sha256sum dist/SpaceKartLegends-base-debug.apk > dist/BASE_SHA256SUMS.txt

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -f "$BUILD_TOOLS_DIR/lib/apksigner.jar"
          cp -a "$BUILD_TOOLS_DIR" dist/android-build-tools

      - name: Upload base APK and Android tools
        uses: actions/upload-artifact@v4
        with:
          name: SpaceKartLegends-turnkey-base
          path: dist/
          if-no-files-found: error
          retention-days: 14
