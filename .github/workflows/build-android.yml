name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: O3DE build configuration
        required: true
        default: profile
        type: choice
        options:
          - profile
          - release
      asset_mode:
        description: Android asset packaging
        required: true
        default: PAK
        type: choice
        options:
          - PAK
          - LOOSE
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

# O3DE and its Android toolchain require a prepared build machine. The job
# deliberately fails instead of publishing an archive when no real APK exists.
jobs:
  build-apk:
    runs-on: [self-hosted, Linux, X64, o3de-26.05, android]
    timeout-minutes: 180

    env:
      O3DE_ENGINE_PATH: /opt/O3DE/26.05
      ANDROID_BUILD_PATH: ${{ github.workspace }}/build/android
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'profile' }}
      ASSET_MODE: ${{ inputs.asset_mode || 'PAK' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pilot and kart blockout models
        run: python3 scripts/generate_blockout_assets.py

      - name: Validate project, assets and Android startup files
        run: |
          python3 scripts/validate_project.py
          python3 scripts/validate_android_scaffold.py

      - name: Verify Android and O3DE tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$O3DE_ENGINE_PATH/scripts/o3de.sh"
          test -f "$O3DE_ENGINE_PATH/scripts/o3de/ExportScripts/export_source_android.py"
          test -n "${ANDROID_SDK_ROOT:-}"
          command -v java
          command -v gradle
          command -v ninja
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" --help >/dev/null

      - name: Register engine and project
        shell: bash
        run: |
          set -euo pipefail
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" register --this-engine
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" register --project-path "$GITHUB_WORKSPACE"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" android-configure --set-value "sdk.root=$ANDROID_SDK_ROOT"
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" android-configure --set-value "platform.sdk.api=34"
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" android-configure --set-value "ndk.version=25.*"
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" android-configure --set-value "android.gradle.plugin=8.1.0"
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" android-configure --set-value "asset.mode=$ASSET_MODE"
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" android-configure --validate

      - name: Export O3DE Android project and build APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_BUILD_PATH"
          "$O3DE_ENGINE_PATH/scripts/o3de.sh" export-project \
            --export-script "$O3DE_ENGINE_PATH/scripts/o3de/ExportScripts/export_source_android.py" \
            --project-path "$GITHUB_WORKSPACE" \
            --android-build-path "$ANDROID_BUILD_PATH" \
            --log-level INFO \
            --config "$BUILD_CONFIGURATION" \
            --asset-mode "$ASSET_MODE"

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_PATH="$(find "$ANDROID_BUILD_PATH" -type f -name '*.apk' ! -name '*unaligned*' | sort | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced by the O3DE export." >&2
            exit 1
          fi
          OUTPUT_APK="dist/SpaceKartLegends-${BUILD_CONFIGURATION}.apk"
          cp "$APK_PATH" "$OUTPUT_APK"
          test -s "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK" | tee dist/SHA256SUMS.txt
          echo "path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceKartLegends-Android-${{ env.BUILD_CONFIGURATION }}
          path: |
            ${{ steps.apk.outputs.path }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
